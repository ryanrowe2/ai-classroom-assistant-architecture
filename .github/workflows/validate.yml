name: Documentation integrity
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  documentation:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      # Pinned to actions/checkout v4.2.2 (reviewed upstream commit).
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      # Pinned to actions/setup-python v5.6.0 (reviewed upstream commit).
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install Graphviz for semantic diagram validation
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends graphviz
          dot -V
      - name: Validate evidence, generated tables, links, diagrams and source inventory
        run: PYTHONDONTWRITEBYTECODE=1 python3 tools/check_docs.py --strict-release
      - name: Run documentation mutation checks
        run: PYTHONDONTWRITEBYTECODE=1 python3 tools/test_check_docs.py
      - name: Test safe source and Git release contract
        run: PYTHONDONTWRITEBYTECODE=1 python3 tools/test_release_contract.py
